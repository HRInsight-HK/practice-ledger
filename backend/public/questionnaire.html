<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实操需求登记表单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 2px 20px rgba(0,0,0,0.08); max-width:560px; width:100%; overflow:hidden; }
  .header { background:linear-gradient(135deg,#4f6ef7,#3d5bd9); color:#fff; padding:28px 32px; }
  .header h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .header p { font-size:13px; opacity:.85; }
  .body { padding:28px 32px; }
  .form-group { margin-bottom:18px; }
  .form-label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:#374151; }
  .req { color:#dc2626; }
  .hint { color:#9ca3af; font-weight:400; font-size:12px; }
  .form-input, .form-select, .form-textarea {
    width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;
    font-size:14px; font-family:inherit; transition:border .2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline:none; border-color:#4f6ef7; box-shadow:0 0 0 3px #eef1fe; }
  .form-textarea { resize:vertical; min-height:72px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .radio-row { display:flex; gap:10px; }
  .radio-card {
    flex:1; border:2px solid #e5e7eb; border-radius:10px; padding:12px;
    cursor:pointer; text-align:center; transition:all .2s; font-size:13px;
  }
  .radio-card:hover { border-color:#9ca3af; }
  .radio-card.selected { border-color:#4f6ef7; background:#eef1fe; color:#4f6ef7; font-weight:600; }
  .btn {
    width:100%; padding:14px; border:none; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .btn-primary { background:#4f6ef7; color:#fff; }
  .btn-primary:hover { background:#3d5bd9; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .success-screen { text-align:center; padding:32px; }
  .success-icon { width:64px; height:64px; border-radius:50%; background:#dcfce7; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px; }
  .success-screen h2 { font-size:18px; font-weight:600; margin-bottom:8px; }
  .success-screen p { font-size:14px; color:#6b7280; }
  .success-summary { background:#f9fafb; border-radius:10px; padding:16px; margin:20px 0; text-align:left; }
  .success-summary .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
  .success-summary .row span:first-child { color:#9ca3af; }
  .error-msg { background:#fef2f2; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
  .footer-note { text-align:center; font-size:12px; color:#9ca3af; margin-top:20px; line-height:1.8; }
  @media (max-width:520px) { .form-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="header">
    <h1>实操需求登记</h1>
    <p>请填写以下信息，提交后行政将进行登记</p>
  </div>
  <div class="body">
    <div class="error-msg" id="errMsg"></div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">提交人姓名 <span class="req">*</span></label>
        <input type="text" class="form-input" id="submitterName" placeholder="您的姓名">
      </div>
      <div class="form-group">
        <label class="form-label">您的身份 <span class="req">*</span></label>
        <div class="radio-row">
          <div class="radio-card" data-role="manager" onclick="selectRole(this)">管理层</div>
          <div class="radio-card" data-role="leader" onclick="selectRole(this)">组长</div>
          <div class="radio-card" data-role="employee" onclick="selectRole(this)">员工</div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">实操人员姓名 <span class="req">*</span></label>
      <input type="text" class="form-input" id="personName" placeholder="需要安排实操的人员全名">
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">建议带教人 <span class="req">*</span></label>
        <input type="text" class="form-input" id="mentorName" placeholder="直接带教负责人">
      </div>
      <div class="form-group">
        <label class="form-label">业务方向</label>
        <input type="text" class="form-input" id="businessArea" placeholder="如：门店运营">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">期望开始日期 <span class="req">*</span></label>
        <input type="date" class="form-input" id="expectStart">
      </div>
      <div class="form-group">
        <label class="form-label">预计实操天数 <span class="req">*</span></label>
        <input type="number" class="form-input" id="expectDays" placeholder="天" min="1">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">设备需求 <span class="hint">（如需配发设备）</span></label>
      <input type="text" class="form-input" id="deviceNeed" placeholder="如：笔记本电脑、扩展坞、显示器">
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-textarea" id="remark" placeholder="其他需要说明的事项..."></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">提交需求</button>
    <div class="footer-note">
      提交后行政会在1个工作日内完成登记<br>
      如有紧急需求请联系行政（莫青霖）或SSC（Zoe）
    </div>
  </div>
</div>

<script>
let selectedRole = '';

function selectRole(el) {
  document.querySelectorAll('.radio-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedRole = el.dataset.role;
}

function showError(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

async function submitForm() {
  const data = {
    submitterName: document.getElementById('submitterName').value.trim(),
    submitterRole: selectedRole,
    personName: document.getElementById('personName').value.trim(),
    mentorName: document.getElementById('mentorName').value.trim(),
    businessArea: document.getElementById('businessArea').value.trim(),
    expectStart: document.getElementById('expectStart').value,
    expectDays: parseInt(document.getElementById('expectDays').value) || 0,
    deviceNeed: document.getElementById('deviceNeed').value.trim(),
    remark: document.getElementById('remark').value.trim()
  };

  if (!data.submitterName) return showError('请填写提交人姓名');
  if (!data.submitterRole) return showError('请选择您的身份');
  if (!data.personName) return showError('请填写实操人员姓名');
  if (!data.mentorName) return showError('请填写建议带教人');
  if (!data.expectStart) return showError('请选择期望开始日期');
  if (!data.expectDays || data.expectDays < 1) return showError('请填写有效的实操天数');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const res = await fetch('/api/questionnaire', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '提交失败');

    const roleText = { manager: '管理层', leader: '组长', employee: '员工' }[data.submitterRole];
    document.getElementById('app').innerHTML = `
      <div class="header">
        <h1>提交成功</h1>
        <p>需求已提交，行政将尽快处理</p>
      </div>
      <div class="body">
        <div class="success-screen">
          <div class="success-icon">&#x2713;</div>
          <h2>实操需求已提交</h2>
          <p>行政将在1个工作日内完成登记</p>
        </div>
        <div class="success-summary">
          <div class="row"><span>提交人</span><span>${data.submitterName}（${roleText}）</span></div>
          <div class="row"><span>实操人员</span><span>${data.personName}</span></div>
          <div class="row"><span>建议带教人</span><span>${data.mentorName}</span></div>
          <div class="row"><span>期望开始</span><span>${data.expectStart}</span></div>
          <div class="row"><span>预计天数</span><span>${data.expectDays} 天</span></div>
          ${data.businessArea ? `<div class="row"><span>业务方向</span><span>${data.businessArea}</span></div>` : ''}
        </div>
      </div>
    `;
  } catch(e) {
    showError(e.message);
    btn.disabled = false;
    btn.textContent = '提交需求';
  }
}

// 默认日期为明天
document.getElementById('expectStart').value = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
</script>
</body>
</html>
