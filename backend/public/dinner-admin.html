<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚餐报销 · 台账后台</title>
<style>
  :root{ --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --card:#fff;
    --blue:#2563eb; --blue-bg:#eff6ff; --green:#059669; --green-bg:#ecfdf5;
    --red:#dc2626; --red-bg:#fef2f2; --amber:#d97706; --amber-bg:#fffbeb; --r:10px; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;}
  .wrap{max-width:1180px; margin:0 auto; padding:20px 14px 60px;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  header h1{font-size:18px;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{padding:6px 16px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--card); font-size:13.5px;}
  .tab.on{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600;}
  .panel{display:none;} .panel.on{display:block;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px;}
  .card h3{font-size:14.5px; margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid var(--line);}
  .toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
  .toolbar input,.toolbar select{width:auto; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px;}
  label{display:block; font-size:12px; color:var(--sub); margin-bottom:3px;}
  input,select{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; width:100%; background:#fff;}
  .btn{display:inline-block; padding:8px 18px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600;}
  .btn.ghost{background:#fff; color:var(--blue); border:1px solid var(--blue);}
  .btn.warn{background:#fff; color:var(--red); border:1px solid var(--red);}
  .btn.green{background:var(--green); border:none; color:#fff;}
  .btn.small{padding:5px 12px; font-size:12px; font-weight:500;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; background:#fff;}
  th{background:#f9fafb; text-align:left; padding:7px 9px; font-size:11.5px; color:var(--sub); border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:7px 9px; border-bottom:1px solid #f1f2f4; white-space:nowrap;}
  /* 操作列固定在右侧，避免被横向滚动条截到看不到删除按钮 */
  #tbl{ min-width: 1280px; }
  #tbl td:last-child, #tbl th:last-child { position: sticky; right: 0; background: #fff; box-shadow: -2px 0 6px rgba(0,0,0,.08); z-index: 2; }
  #tbl thead th:last-child { background: #f9fafb; }
  .pill{display:inline-block; padding:1px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .pill.g{background:var(--green-bg); color:var(--green);}
  .pill.r{background:var(--red-bg); color:var(--red);}
  .pill.b{background:var(--blue-bg); color:var(--blue);}
  .pill.a{background:var(--amber-bg); color:var(--amber);}
  .pill.p{background:#f3e8ff; color:#7c3aed;}
  .money{font-variant-numeric:tabular-nums; font-weight:600;}
  .money.cap{color:var(--amber);}
  .summary{font-size:12.5px; color:var(--sub); margin-top:10px;}
  .transfer{background:#f9fafb; border:1px solid var(--line); border-radius:var(--r); padding:12px; white-space:pre-wrap; font-size:12.5px; margin-top:10px; display:none;}
  .transfer.show{display:block;}
  .login{max-width:360px; margin:80px auto 0;}
  .err{background:var(--red-bg); border:1px solid #fecaca; color:var(--red); border-radius:8px; padding:8px 12px; font-size:13px; margin-top:10px; display:none;}
  .err.show{display:block;}
  .scroll{overflow-x:auto;}
  .del{color:var(--red); cursor:pointer; font-size:12px; text-decoration:underline; background:none; border:none;}
  .empty{text-align:center; color:var(--sub); padding:24px 0;}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:#fff;border-radius:var(--r);padding:18px;max-width:640px;width:94%;max-height:90vh;overflow-y:auto;}
  .modal h3{margin-bottom:10px;}
  .receipt-link{font-size:11px;color:var(--blue);margin-left:4px;text-decoration:underline;}
  .proof-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
  .cmp{font-size:12px;margin:1px 0;}
  .cmp .f{color:var(--sub);}
  .cmp .mismatch{color:var(--red);font-weight:600;}
  .cmp .match{color:var(--green);}
  .count-badge{background:var(--amber);color:#fff;border-radius:20px;padding:0 7px;font-size:11px;margin-left:4px;}
  .count-badge.red{background:var(--red);}
  .count-badge.blue{background:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <!-- 登录 -->
  <div class="login card" id="view-login">
    <h3>晚餐报销台账后台登录</h3>
    <div style="margin-bottom:10px;"><label>账号</label><input id="l-user" placeholder="hr / admin"></div>
    <div style="margin-bottom:12px;"><label>密码</label><input id="l-pass" type="password"></div>
    <button class="btn" style="width:100%;" onclick="doLogin()">登录</button>
    <div class="err" id="l-err"></div>
    <div class="summary" style="margin-top:10px;">使用台账系统账号（SSC：hr / 行政：admin）</div>
  </div>

  <!-- 主界面 -->
  <div id="view-main" style="display:none;">
    <header>
      <h1>🧾 晚餐报销 · 台账后台</h1>
      <div><span id="who" style="font-size:13px; color:var(--sub); margin-right:10px;"></span><button class="btn small ghost" onclick="logout()">退出</button></div>
    </header>

    <div class="tabs">
      <div class="tab on" data-t="ledger">审核台账</div>
      <div class="tab" data-t="weekly">周结算汇总</div>
    </div>

    <div class="panel on" id="p-ledger">
      <div class="card">
        <h3>提交记录</h3>
        <div class="toolbar">
          <input id="flt-name" placeholder="按姓名筛选" oninput="renderLedger()">
          <select id="flt-review" onchange="renderLedger()" style="width:auto;">
            <option value="">全部核验状态</option>
            <option value="pendingVerify">待识别</option>
            <option value="pendingManual">待人工审核</option>
            <option value="verified">已核验</option>
            <option value="rejected">已驳回</option>
          </select>
          <select id="flt-status" onchange="renderLedger()"><option value="">全部判定</option><option value="PASS">仅通过</option><option value="FAIL">仅不通过</option></select>
          <select id="flt-paid" onchange="renderLedger()" style="width:auto;">
            <option value="">全部打款</option><option value="UNPAID">仅未打款</option><option value="PAID">仅已打款</option>
          </select>
          <select id="flt-range" onchange="renderLedger()" style="width:auto;">
            <option value="">全部时间</option>
            <option value="week">近 1 周</option>
            <option value="month">近 1 月</option>
          </select>
          <span style="flex:1"></span>
          <button class="btn small ghost" id="btn-mark-missing" onclick="markImageMissing()" title="把当前待识别但图片已丢失的旧记录一键转为待人工审核（避免每次手动触发都浪费智谱配额）">🧹 标记图片丢失</button>
          <button class="btn small green" id="btn-recognize-all" onclick="recognizeAllPending()">🤖 识别全部待核验</button>
          <button class="btn small ghost" id="btn-batch-pay" onclick="openBatchPay()" disabled>💰 批量打款（0）</button>
          <button class="btn small ghost" onclick="loadRecords()">↻ 刷新</button>
          <button class="btn small ghost" onclick="exportCSV()">⬇ 导出 CSV</button>
        </div>
        <div class="scroll"><table id="tbl"><thead><tr>
          <th><input type="checkbox" id="check-all" onchange="toggleAll(this.checked)"></th>
          <th>提交时间</th><th>姓名</th><th>一级部门</th><th>用餐日期</th><th>核验</th><th>证明图</th><th>员工填写</th><th>识别结果</th><th>判定</th><th>可报</th><th>原因 / 说明</th><th>支付宝</th><th>打款</th><th>操作</th>
        </tr></thead><tbody></tbody></table></div>
        <div class="summary" id="ledger-summary"></div>
      </div>
    </div>

    <div class="panel" id="p-weekly">
      <div class="card">
        <h3>周结算（每周五执行）</h3>
        <div class="toolbar">
          <label style="margin:0;">结算周：</label>
          <select id="week-sel" onchange="renderWeekly()"></select>
        </div>
        <div class="scroll"><table id="tbl-weekly"><thead><tr>
          <th>姓名</th><th>支付宝账号</th><th>实名</th><th>通过笔数</th><th>本周累计可报</th><th>应转金额（周封顶 100）</th>
        </tr></thead><tbody></tbody></table></div>
        <div class="summary" id="weekly-summary"></div>
        <button class="btn small ghost" onclick="makeTransfer()">📋 生成转账清单</button>
        <div class="transfer" id="transfer"></div>
      </div>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY='dinner_admin_token', USER_KEY='dinner_admin_user';
let records=[];
const ST={PASS_A:['通过','g'],PASS_B:['通过','g'],PASS_CAPPED:['通过(封顶)','a'],
  FAIL_BLUR:['不通过','r'],FAIL_DATE:['不通过','r'],FAIL_DUP:['不通过','r'],FAIL_TIME:['不通过','r'],
  FAIL_WEEKCAP:['不通过(周满)','r'],FAIL_ORDERCAP:['不通过(单满)','r'],FAIL_MANUAL:['人工驳回','r']};
const RV={pendingVerify:['待识别','b'],pendingManual:['待人工审核','a'],verified:['已核验','g'],rejected:['已驳回','r']};

function api(path,opts){ const h={'Content-Type':'application/json'};
  const t=localStorage.getItem(TOKEN_KEY); if(t) h['Authorization']='Bearer '+t;
  return fetch('/api/dinner'+path,{...opts,headers:{...h,...(opts&&opts.headers||{})}}).then(r=>r.json().then(j=>({ok:r.ok,j})));
}

function doLogin(){
  const u=document.getElementById('l-user').value.trim(), p=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err'); err.className='err';
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(!ok){ err.textContent=j.error||'登录失败'; err.className='err show'; return; }
      localStorage.setItem(TOKEN_KEY,j.token);
      localStorage.setItem(USER_KEY,JSON.stringify(j.user||{}));
      enterMain();
    })
    .catch(()=>{ err.textContent='网络错误'; err.className='err show'; });
}
function enterMain(){
  document.getElementById('view-login').style.display='none';
  document.getElementById('view-main').style.display='block';
  const u=JSON.parse(localStorage.getItem(USER_KEY)||'{}');
  document.getElementById('who').textContent=(u.name||'')+'（'+(u.username||'')+'）';
  loadRecords();
}
function logout(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); location.reload(); }

document.getElementById('l-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
if(localStorage.getItem(TOKEN_KEY)){
  fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+localStorage.getItem(TOKEN_KEY)}})
    .then(r=>{ if(r.ok) enterMain(); }).catch(()=>{});
}

function loadRecords(){
  api('/records').then(({ok,j})=>{
    if(!ok){ if(j&&j.error&&j.error.includes('登录')){ localStorage.removeItem(TOKEN_KEY); location.reload(); } return; }
    records=j.records||[]; renderLedger(); renderWeekly();
  });
}

function mondayOf(dstr){ const d=new Date(dstr+'T00:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function weekLabel(m){ const a=new Date(m+'T00:00:00'),b=new Date(m+'T00:00:00'); b.setDate(b.getDate()+6);
  return (a.getMonth()+1)+'月'+a.getDate()+'日 - '+(b.getMonth()+1)+'月'+b.getDate()+'日'; }
function fmtM(n){ return (Math.round(n*10)/10).toFixed(1); }

function renderLedger(){
  const fn=document.getElementById('flt-name').value.trim();
  const fr=document.getElementById('flt-review').value;
  const fs=document.getElementById('flt-status').value;
  const fp=document.getElementById('flt-paid').value;
  const fg=document.getElementById('flt-range').value;
  const now=new Date();
  let list=records.filter(r=>
    (!fn||r.name.includes(fn))&&
    (!fr||r.reviewStatus===fr)&&
    (!fs||(fs==='PASS'?r.status&&r.status.startsWith('PASS'):r.status&&r.status.startsWith('FAIL')))&&
    (!fp||(fp==='PAID'?r.paid:!r.paid))
  );
  if(fg==='week'){ const cutoff=new Date(now.getTime()-7*86400000); list=list.filter(r=>new Date(r.createdAt)>=cutoff); }
  if(fg==='month'){ const cutoff=new Date(now.getTime()-30*86400000); list=list.filter(r=>new Date(r.createdAt)>=cutoff); }

  document.querySelector('#tbl tbody').innerHTML=list.map(r=>{
    const [txt,cls]=ST[r.status]||['—','b'];
    const [rvtxt,rvcls]=RV[r.reviewStatus]||['—','b'];
    const canCheck=r.status&&r.status.startsWith('PASS')&&!r.paid&&r.reviewStatus==='verified';
    const ck=canCheck?'<input type="checkbox" class="row-check" data-id="'+r.id+'" data-name="'+esc(r.name)+'" data-amount="'+r.amount+'" onchange="onCheckChange()">':'<span style="color:var(--sub)">—</span>';
    const rs=receiptSrc(r);
    const paidCell=r.paid
      ? '<span class="pill g" title="'+(r.paidAt||'')+'">已打款</span> '+(rs?'<a href="'+esc(rs.href)+'" target="_blank" class="receipt-link">凭证</a>':'')
      : '<span class="pill b">未打款</span>';
    // 证明图缩略（优先库内 base64，回退 URL）+ 图片状态徽标
    const orderState = r.orderImgData ? '已存' : (r.orderImg ? '⚠️丢失' : '无');
    const punchState = r.punchImgData ? '已存' : (r.punchImg ? '⚠️丢失' : '无');
    const orderTag = r.orderImgData ? '<span class="pill g" style="font-size:11px;padding:2px 6px;">已存</span>' : (r.orderImg ? '<span class="pill r" style="font-size:11px;padding:2px 6px;">已丢失</span>' : '<span style="color:var(--sub);font-size:11px;">无</span>');
    const punchTag = r.punchImgData ? '<span class="pill g" style="font-size:11px;padding:2px 6px;">已存</span>' : (r.punchImg ? '<span class="pill r" style="font-size:11px;padding:2px 6px;">已丢失</span>' : '<span style="color:var(--sub);font-size:11px;">无</span>');
    const proofs=(r.orderImgData||r.orderImg?'<div style="margin-bottom:4px;">'+orderTag+' <img class="proof-thumb" src="'+esc(proofSrc(r,'orderImg'))+'" title="订单证明图 '+orderState+'" onclick="viewImg(\''+esc(proofSrc(r,'orderImg'))+'\')"></div>':'')+(r.punchImgData||r.punchImg?'<div>'+punchTag+' <img class="proof-thumb" src="'+esc(proofSrc(r,'punchImg'))+'" title="打卡证明图 '+punchState+'" onclick="viewImg(\''+esc(proofSrc(r,'punchImg'))+'\')"></div>':'');
    // 员工填写 vs 识别结果
    const f=r.fields||{};
    const a=r.ai||{};
    const orderCell=(f.orderTime||'—')+(f.orderNo?'<br>订单号 '+esc(f.orderNo):'')+(f.amount?'<br>'+fmtM(f.amount)+' 元':'');
    const aiCell=(a.orderTime||'—')+(a.orderNo?'<br>订单号 '+esc(a.orderNo):'')+(a.amount?'<br>'+fmtM(a.amount)+' 元':'')+(a.confidence!=null?'<br><span style="color:var(--sub)">置信 '+a.confidence+'%</span>':'');
    // 操作按钮
    let ops='<button class="del" onclick="delRec(\''+r.id+'\')">删除</button>';
    if(r.reviewStatus==='pendingVerify') ops+=' <button class="btn small ghost" onclick="recognizeOne('+r.id+')">🤖 识别</button>';
    if(r.reviewStatus==='pendingManual') ops+=' <button class="btn small ghost" onclick="recognizeOne(\''+r.id+'\')">🔁 重新识别</button> <button class="btn small green" onclick="openReview(\''+r.id+'\')">人工审核</button>';
    if(r.paid) ops+=' <button class="del" style="color:var(--sub);border-color:transparent;" onclick="unpayRec(\''+r.id+'\')">撤回</button>';
    return '<tr><td>'+ck+'</td><td>'+r.createdAt.replace('T',' ').slice(0,16)+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.dept1)+(r.dept2?' / '+esc(r.dept2):'')+'</td><td>'+r.date+'</td>'+
      '<td><span class="pill '+rvcls+'">'+rvtxt+'</span></td>'+
      '<td>'+proofs+'</td>'+
      '<td style="white-space:normal;max-width:150px;">'+orderCell+'</td>'+
      '<td style="white-space:normal;max-width:150px;">'+aiCell+'</td>'+
      '<td><span class="pill '+cls+'">'+txt+'</span></td>'+
      '<td class="money '+(r.status==='PASS_CAPPED'?'cap':'')+'">'+(r.amount>0?fmtM(r.amount)+' 元':'—')+'</td>'+
      '<td style="white-space:normal; max-width:240px;">'+(r.verifyInfo&&r.verifyInfo.imageMissing?'<span class="pill r">🖼️ 图片已丢失</span> 请员工重新提交':esc(r.reason||(r.verifyInfo&&r.verifyInfo.differences?('⚠️ '+r.verifyInfo.differences.join('；')):'')))+'</td>'+
      '<td style="white-space:normal;">'+esc(r.ali)+'<br>'+esc(r.aliname)+'</td>'+
      '<td style="white-space:normal; min-width:120px;">'+paidCell+'</td>'+
      '<td style="white-space:nowrap;">'+ops+'</td></tr>';
  }).join('')||'<tr><td colspan="15" class="empty">暂无记录</td></tr>';

  const pv=records.filter(r=>r.reviewStatus==='pendingVerify').length;
  const pm=records.filter(r=>r.reviewStatus==='pendingManual').length;
  const passN=records.filter(r=>r.status&&r.status.startsWith('PASS')&&r.reviewStatus==='verified').length;
  const paidN=records.filter(r=>r.paid).length;
  const passPaid=records.filter(r=>r.status&&r.status.startsWith('PASS')&&r.paid).length;
  const unpaidAmt=records.filter(r=>r.status&&r.status.startsWith('PASS')&&!r.paid).reduce((s,r)=>s+r.amount,0);
  const paidAmt=records.filter(r=>r.status&&r.status.startsWith('PASS')&&r.paid).reduce((s,r)=>s+r.amount,0);
  document.getElementById('ledger-summary').innerHTML=records.length?(
    `共 ${records.length} 条 · 待识别 ${pv} · 待人工 ${pm} · 已核验通过 ${passN} · 已打款 ${passPaid}/${passN}（${fmtM(paidAmt)} 元） · 待打款 ${fmtM(unpaidAmt)} 元`):'';
  document.getElementById('btn-recognize-all').textContent=pv?'🤖 识别全部待核验（'+pv+'）':'🤖 识别全部待核验';
  // 更新 tab 徽标
  document.querySelectorAll('.tab').forEach(t=>{
    const n=t.dataset.t==='ledger'?((pv+pm)||''):'';
    const badge=t.querySelector('.count-badge');
    if(n){ if(!badge) t.insertAdjacentHTML('beforeend','<span class="count-badge'+(pm?' red':'')+'">'+n+'</span>'); else badge.textContent=n; }
    else if(badge) badge.remove();
  });
  onCheckChange();
}

function onCheckChange(){
  const cks=[...document.querySelectorAll('.row-check:checked')];
  const btn=document.getElementById('btn-batch-pay');
  btn.disabled=cks.length===0;
  const byName={};
  cks.forEach(c=>{ const n=c.dataset.name, a=parseFloat(c.dataset.amount||0); byName[n]=(byName[n]||0)+a; });
  const summary=Object.keys(byName).length===0?'':(' · '+Object.entries(byName).map(([n,a])=>`${n} ${fmtM(a)}`).join(' / '));
  btn.textContent=`💰 批量打款（${cks.length}${summary}）`;
}
function toggleAll(on){ document.querySelectorAll('.row-check').forEach(c=>{ c.checked=on; }); onCheckChange(); }

// ==================== 识别 ====================
function recognizeOne(id){
  const btn=event&&event.target; const orig=btn?btn.textContent:'🤖 识别';
  if(btn){ btn.disabled=true; btn.textContent='识别中…'; }
  api('/records/'+id+'/recognize',{method:'POST'}).then(({ok,j})=>{
    if(btn){ btn.disabled=false; btn.textContent=orig; }
    if(ok){ alert(j.matched?'✅ 识别一致，自动判定：'+(j.status||'')+'，可报 '+fmtM(j.amount)+' 元':'⚠️ 有差异，已转人工审核：\n'+(j.differences||[]).join('\n')); }
    else { alert('识别失败：'+(j.error||'')); }
    loadRecords();
  }).catch(()=>{ if(btn){btn.disabled=false;btn.textContent=orig;} alert('网络错误'); });
}
function recognizeAllPending(){
  const pvs=records.filter(r=>r.reviewStatus==='pendingVerify');
  const groups=[...new Set(pvs.map(r=>r.groupNo).filter(Boolean))];
  if(!pvs.length){ alert('没有待识别的记录'); return; }
  if(!confirm('将识别 '+pvs.length+' 条待核验记录，识别一致自动通过，有差异转人工审核。继续？')) return;
  // 按整单逐个识别
  let done=0;
  const run=groups.concat(pvs.filter(r=>!r.groupNo).map(r=>r.id));
  const seq=(arr)=>{ if(!arr.length){ loadRecords(); alert('识别完成'); return; }
    const g=arr.shift();
    const apiCall= g.startsWith('G')
      ? api('/group/'+g+'/recognize',{method:'POST'})
      : api('/records/'+g+'/recognize',{method:'POST'});
    apiCall.finally(()=>seq(arr));
  };
  // 简化：直接逐条识别（整单接口同样可用，这里用单条更稳妥）
  const ids=pvs.map(r=>r.id);
  const runSeq=(list)=>{ if(!list.length){ loadRecords(); alert('识别完成'); return; }
    api('/records/'+list.shift()+'/recognize',{method:'POST'}).finally(()=>runSeq(list));
  };
  runSeq(ids.slice());
}

// 一键标记图片已丢失的待识别记录为待人工审核
// 适用：旧版本 multipart 提交的记录，文件已被 Render 清空，再触发识别只会浪费智谱配额
function markImageMissing(){
  if(!confirm('把当前待识别但图片已丢失的旧记录一键转为待人工审核？\n（不再调用智谱，直接标"图片已丢失，请员工重新提交"）')) return;
  api('/records/mark-image-missing',{method:'POST'}).then(j=>{
    if(j&&j.success){
      alert('已标记 '+j.updated+' 条图片丢失的记录为待人工审核');
      loadRecords();
    } else {
      alert((j&&j.error)||'操作失败');
    }
  }).catch(e=>alert('网络错误：'+(e.message||e)));
}

// ==================== 人工审核 ====================
function openReview(id){

  const html=`
    <div class="modal-mask" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>人工审核 · ${esc(r.name)}（${r.date}）</h3>
        ${diffs.length?'<div class="cmp" style="margin-bottom:8px;"><b>差异提示：</b>'+(diffs.map(d=>'<div class="mismatch">⚠️ '+esc(d)+'</div>').join(''))+'</div>':''}
        <div style="display:flex;gap:10px;margin-bottom:10px;">
          <div style="flex:1;"><div style="font-size:12px;color:var(--sub)">员工填写</div>
            <div style="font-size:12.5px;">下单 ${esc(f.orderTime||'—')}<br>订单号 ${esc(f.orderNo||'—')}<br>实付 ${fmtM(f.amount||0)} 元<br>打卡 ${esc(f.punchTime||'—')} ${esc(f.punchDate||'')}</div></div>
          <div style="flex:1;"><div style="font-size:12px;color:var(--sub)">截图识别</div>
            <div style="font-size:12.5px;">下单 ${esc(a.orderTime||'—')}<br>订单号 ${esc(a.orderNo||'—')}<br>实付 ${fmtM(a.amount||0)} 元<br>打卡 ${esc(a.punchTime||'—')} ${esc(a.punchDate||'')}</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
          ${(r.orderImgData||r.orderImg)?'<a href="'+esc(proofSrc(r,'orderImg'))+'" target="_blank"><img src="'+esc(proofSrc(r,'orderImg'))+'" style="max-width:200px;max-height:140px;border-radius:6px;border:1px solid var(--line)"></a>':''}
          ${(r.punchImgData||r.punchImg)?'<a href="'+esc(proofSrc(r,'punchImg'))+'" target="_blank"><img src="'+esc(proofSrc(r,'punchImg'))+'" style="max-width:200px;max-height:140px;border-radius:6px;border:1px solid var(--line)"></a>':''}
        </div>
        <div style="margin-bottom:10px;"><label>核对后修正字段（不填则用员工填写/识别值）</label>
          <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><label>下单时间</label><input id="rv-order" value="${esc(a.orderTime||f.orderTime||'')}"></div>
            <div><label>订单号</label><input id="rv-no" value="${esc(a.orderNo||f.orderNo||'')}"></div>
            <div><label>实付金额</label><input id="rv-amount" value="${a.amount||f.amount||''}"></div>
            <div><label>打卡时间</label><input id="rv-punch" value="${esc(a.punchTime||f.punchTime||'')}"></div>
          </div>
        </div>
        <div style="margin-bottom:10px;"><label>备注（选填）</label><input id="rv-note" placeholder="如：打卡图较糊，人工核对无误"></div>
        <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn small warn" onclick="reviewAction('${id}','reject')">✗ 驳回</button>
          <button class="btn small ghost" onclick="closeModal()">取消</button>
          <button class="btn small green" onclick="reviewAction('${id}','approve')">✓ 核验通过</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function reviewAction(id, action){
  const fd={action};
  if(action==='approve'){
    fd.fields={
      orderTime:document.getElementById('rv-order').value.trim(),
      orderNo:document.getElementById('rv-no').value.trim(),
      amount:parseFloat(document.getElementById('rv-amount').value)||0,
      punchTime:document.getElementById('rv-punch').value.trim()
    };
    fd.note=document.getElementById('rv-note').value.trim();
  } else {
    fd.note=document.getElementById('rv-note')?document.getElementById('rv-note').value.trim():'';
  }
  api('/records/'+id+'/manual-review',{method:'POST',body:JSON.stringify(fd)}).then(({ok,j})=>{
    closeModal();
    if(!ok){ alert(j.error||'操作失败'); return; }
    alert(action==='approve'?('✅ 已核验通过，判定：'+(j.status||'')+'，可报 '+fmtM(j.amount)+' 元'):'已驳回');
    loadRecords();
  }).catch(()=>{ alert('网络错误'); });
}

function closeModal(){ const m=document.querySelector('.modal-mask'); if(m) m.remove(); }

// ==================== 批量打款模态 ====================
function openBatchPay(){
  const cks=[...document.querySelectorAll('.row-check:checked')];
  if(!cks.length) return;
  const byName={};
  cks.forEach(c=>{ const n=c.dataset.name,a=parseFloat(c.dataset.amount||0); (byName[n]=byName[n]||{count:0,amount:0}).count++; byName[n].amount+=a; });
  const rows=Object.entries(byName).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.count}</td><td class="money">${fmtM(v.amount)} 元</td></tr>`).join('');
  const total=cks.reduce((s,c)=>s+parseFloat(c.dataset.amount||0),0);
  const ids=cks.map(c=>c.dataset.id).join(',');
  const html=`
    <div class="modal-mask" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>💰 批量打款（${cks.length} 条 · ${fmtM(total)} 元）</h3>
        <p style="font-size:13px;color:var(--sub);margin-bottom:10px;">一次上传一张转账凭证，对应一笔支付宝转账；同一批次记录共享批次号便于追溯。</p>
        <table><thead><tr><th>姓名</th><th>笔数</th><th>合计金额</th></tr></thead><tbody>${rows}</tbody></table>
        <div style="margin-top:12px;"><label>打款凭证截图（PNG/JPG/WEBP，可选）</label><input type="file" id="pay-receipt" accept="image/*"></div>
        <div style="margin-top:10px;"><label>备注（可选）</label><input id="pay-note" placeholder="例如：支付宝转账 2026-08-29 周五"></div>
        <div style="margin-top:14px;text-align:right;">
          <button class="btn small ghost" onclick="closeModal()">取消</button>
          <button class="btn" onclick="submitBatchPay('${ids}')">确认打款</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function submitBatchPay(ids){
  const file=document.getElementById('pay-receipt').files[0];
  const note=document.getElementById('pay-note').value.trim();
  const doSubmit=(receiptData)=>{
    const payload={ids,note};
    if(receiptData) payload.receiptData=receiptData;
    const token=localStorage.getItem(TOKEN_KEY);
    fetch('/api/dinner/records/batch-pay',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)})
      .then(r=>r.json().then(j=>({ok:r.ok,j})))
      .then(({ok,j})=>{
        if(!ok){ alert(j.error||'打款失败'); return; }
        closeModal();
        alert('已打款 '+j.paidCount+' 条，合计 '+fmtM(j.totalAmount)+' 元'+(j.skipped&&j.skipped.length?'；跳过 '+j.skipped.length+' 条':''));
        loadRecords();
      })
      .catch(()=>alert('网络错误'));
  };
  if(file){
    compressImage(file).then(doSubmit).catch(()=>alert('凭证压缩失败，请重试'));
  } else {
    doSubmit(null);
  }
}

// 图片压缩（后端 base64 存库，兼容打款凭证）
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1280; let {width:w,height:h}=img;
      if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.7));
    };
    img.onerror=()=>reject(new Error('图片读取失败'));
    img.src=URL.createObjectURL(file);
  });
}

function renderWeekly(){
  const sel=document.getElementById('week-sel');
  const weeks=[...new Set(records.map(r=>mondayOf(r.date)))].sort().reverse();
  if(weeks.join()!==[...sel.options].map(o=>o.value).join()){
    sel.innerHTML=weeks.map(w=>'<option value="'+w+'">'+weekLabel(w)+'</option>').join('');
  }
  const wk=sel.value||weeks[0]; if(!wk) return;
  const passes=records.filter(r=>r.status&&r.status.startsWith('PASS')&&r.reviewStatus==='verified'&&mondayOf(r.date)===wk);
  const byName={};
  passes.forEach(r=>{
    if(!byName[r.name]) byName[r.name]={name:r.name,ali:r.ali,aliname:r.aliname,n:0,sum:0,paid:0,paidSum:0};
    byName[r.name].n++; byName[r.name].sum+=r.amount;
    if(r.paid){ byName[r.name].paid++; byName[r.name].paidSum+=r.amount; }
  });
  const rows=Object.values(byName);
  document.querySelector('#tbl-weekly tbody').innerHTML=rows.map(x=>{
    const transfer=Math.min(x.sum,100);
    const payTag=x.paid===x.n?' <span class="pill g">已打款</span>':(x.paid>0?' <span class="pill a">'+x.paid+'/'+x.n+' 已打款</span>':' <span class="pill b">未打款</span>');
    return '<tr><td><b>'+esc(x.name)+payTag+'</b></td><td>'+esc(x.ali)+'</td><td>'+esc(x.aliname)+'</td><td>'+x.n+'</td><td class="money">'+fmtM(x.sum)+' 元</td>'+
      '<td class="money'+(x.sum>=100?' cap':'')+'">'+fmtM(transfer)+' 元</td></tr>';
  }).join('')||'<tr><td colspan="6" class="empty">该周无通过记录</td></tr>';
  const total=rows.reduce((s,x)=>s+Math.min(x.sum,100),0);
  const paidTotal=rows.reduce((s,x)=>s+Math.min(x.paidSum,100),0);
  const unpaidTotal=total-paidTotal;
  document.getElementById('weekly-summary').innerHTML=rows.length?(
    `本周共 ${rows.length} 人 · 合计 ${fmtM(total)} 元 · 已打款 ${fmtM(paidTotal)} 元（${total?Math.round(paidTotal/total*100):0}%） · 待打款 ${fmtM(unpaidTotal)} 元`):'';
  return {wk,rows,total,paidTotal,unpaidTotal};
}

function makeTransfer(){
  const r=renderWeekly()||{};
  const wk=r.wk,rows=r.rows,total=r.total;
  const box=document.getElementById('transfer');
  if(!rows||!rows.length){ box.className='transfer show'; box.textContent='该周无通过记录，无需转账。'; return; }
  const lines=rows.map(x=>{
    const transfer=Math.min(x.sum,100);
    const tag=x.paid===x.n?'✅':(x.paid>0?'⚠️ '+x.paid+'/'+x.n:'❌ 待打款');
    return x.name+'（'+x.aliname+'　'+x.ali+'）　'+fmtM(transfer)+' 元　'+tag;
  });
  box.className='transfer show';
  box.textContent='【加班晚餐周结算】'+weekLabel(wk)+'\n'+lines.join('\n')+'\n合计：'+fmtM(total)+' 元（已打款 '+fmtM(r.paidTotal||0)+' 元，待打款 '+fmtM(r.unpaidTotal||0)+' 元）\n\n执行：到后台「审核台账」勾选某人未打款记录 →「批量打款」→ 上传转账截图并提交。';
  if(navigator.clipboard){ navigator.clipboard.writeText(box.textContent).then(()=>{ box.textContent+='\n（已复制到剪贴板）'; }); }
}

function exportCSV(){
  const head='提交时间,姓名,一级部门,二级部门,用餐日期,核验状态,员工下单,员工打卡,识别下单,识别打卡,判定结果,可报金额,原因说明,支付宝账号,支付宝实名\n';
  const body=records.map(r=>[r.createdAt.replace('T',' ').slice(0,16),r.name,r.dept1,r.dept2||'',r.date,
    (RV[r.reviewStatus]||[''])[0],
    (r.fields&&(r.fields.orderTime||''))+'/'+(r.fields&&r.fields.punchTime||''),
    (r.ai&&(r.ai.orderTime||''))+'/'+(r.ai&&r.ai.punchTime||''),
    (ST[r.status]||['—'])[0],r.amount,(r.reason||'').replace(/[,，]/g,'；'),r.ali,r.aliname].join(',')).join('\n');
  const blob=new Blob(['\ufeff'+head+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='晚餐报销审核台账.csv'; a.click();
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 图片展示源：优先库内 base64（orderImgData/punchImgData），否则回退文件 URL（兼容旧记录）
function proofSrc(r, field){
  const d=r && (field==='orderImg'?r.orderImgData:r.punchImgData);
  if(d) return 'data:image/jpeg;base64,'+d;
  const u=r && (field==='orderImg'?r.orderImg:r.punchImg);
  return u||null;
}
function receiptSrc(r){
  if(r && r.paidReceipt){
    if(r.paidReceipt.receiptData) return {src:'data:image/jpeg;base64,'+r.paidReceipt.receiptData, href:'data:image/jpeg;base64,'+r.paidReceipt.receiptData};
    if(r.paidReceipt.url) return {src:r.paidReceipt.url, href:r.paidReceipt.url};
  }
  return null;
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); document.getElementById('p-'+t.dataset.t).classList.add('on');
});
